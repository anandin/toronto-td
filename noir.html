<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============ NEON NOIR — look slice, Yonge & Dundas ============
   Frame: metres, origin at the intersection centre. x = east, z = SOUTH
   (north is -z), y up. Buildings are the game's real sector footprints. */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060b14);
const FOG_STREET = 0.0135, FOG_EAGLE = 0.0045;
scene.fog = new THREE.FogExp2(0x0a1424, FOG_STREET);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 1600);

/* ---------- lights: a dark city, pockets of neon ---------- */
const hemi = new THREE.HemisphereLight(0x24354f, 0x05070a, 0.45); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fb4e8, 0.38);
moon.position.set(-60, 120, 40);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -130; moon.shadow.camera.right = 130;
moon.shadow.camera.top = 130; moon.shadow.camera.bottom = -130;
moon.shadow.camera.far = 320; moon.shadow.bias = -0.0006;
scene.add(moon);

function pool(color, intensity, dist, x, y, z){
  const L = new THREE.PointLight(color, intensity, dist, 2.0);
  L.position.set(x, y, z); scene.add(L); return L;
}
pool(0xff2d55, 170, 55,  10, 8,   6);   // red signage, SE corner
pool(0x19d3ff, 150, 55,   6, 9, -20);   // cyan, NE corner
pool(0xff3df0, 120, 50, -10, 8,  -4);   // magenta, NW
pool(0xffb46b, 120, 44,   0, 10,   0);   // warm sodium at the crossing
pool(0xff4040, 70, 30,  -8, 5,  10);   // pharmacy cross, SW

const heroSpot = new THREE.SpotLight(0xffd9a0, 520, 34, 0.62, 0.55, 1.6);
heroSpot.position.set(6, 9.2, 10);
heroSpot.target.position.set(4.2, 0, 7.2);
scene.add(heroSpot, heroSpot.target);

/* ---------- canvas texture helpers ---------- */
function cnv(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

/* facade: one canvas tile = 24 m x 24 m of wall. Returns {map, emissiveMap}. */
function facadeTextures(base, frame, litRatio, seed){
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const [c, g] = cnv(512, 512), [ce, ge] = cnv(512, 512);
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, 512, 512);
  const cols = 8, rows = 8, cw = 512/cols, ch = 512/rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
    const x = i*cw + cw*0.22, y = j*ch + ch*0.2, w = cw*0.56, h = ch*0.6;
    const lit = rnd() < litRatio;
    g.fillStyle = lit ? frame : 'rgba(10,14,20,0.9)';
    g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.strokeRect(x, y, w, h);
    if (lit){
      const warm = rnd() < 0.62;
      const col = warm ? '255,180,107' : (rnd() < 0.8 ? '188,216,255' : '120,240,255');
      const a = 0.35 + rnd() * 0.65;
      ge.fillStyle = `rgba(${col},${a})`; ge.fillRect(x, y, w, h);
      if (rnd() < 0.3){ ge.fillStyle = 'rgba(0,0,0,0.5)'; ge.fillRect(x, y + h*0.5, w, 2); } // blind line
    }
  }
  // grime streaks
  for (let k = 0; k < 26; k++){
    g.fillStyle = `rgba(0,0,0,${0.04 + rnd()*0.09})`;
    const x = rnd()*512; g.fillRect(x, 0, 2 + rnd()*7, 512);
  }
  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping; map.repeat.set(1/24, 1/24);
  map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 4;
  const emi = new THREE.CanvasTexture(ce);
  emi.wrapS = emi.wrapT = THREE.RepeatWrapping; emi.repeat.set(1/24, 1/24);
  emi.colorSpace = THREE.SRGBColorSpace;
  return { map, emissiveMap: emi };
}
const facadeVariants = [
  new THREE.MeshStandardMaterial({ ...facadeTextures('#232c38', '#3d5a74', 0.34, 1237), roughness:.62, metalness:.28, emissive:0xffffff, emissiveIntensity:1.15 }),
  new THREE.MeshStandardMaterial({ ...facadeTextures('#2b2320', '#4a3a30', 0.26, 7331), roughness:.85, metalness:.05, emissive:0xffffff, emissiveIntensity:1.0 }),
  new THREE.MeshStandardMaterial({ ...facadeTextures('#1d2126', '#33506b', 0.42, 9917), roughness:.45, metalness:.4,  emissive:0xffffff, emissiveIntensity:1.3 }),
];
const roofMat = new THREE.MeshStandardMaterial({ color:0x0b0e13, roughness:.95 });

/* ---------- the city from real footprints ---------- */
const cityGroup = new THREE.Group(); scene.add(cityGroup);
fetch('noir-buildings.json').then(r => r.json()).then(list => {
  list.forEach((b, idx) => {
    let cx = 0, cy = 0; b.pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= b.pts.length; cy /= b.pts.length;
    if ((Math.abs(cx) < 16 && Math.abs(cy) < 75) || (Math.abs(cy) < 16 && Math.abs(cx) < 75)) return; // road corridors — square/underground footprints are not buildings
    const shape = new THREE.Shape();
    b.pts.forEach((p, i) => { const X = p[0], Y = p[1]; if (i === 0) shape.moveTo(X, Y); else shape.lineTo(X, Y); });
    const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(6, b.h), bevelEnabled:false });
    geo.rotateX(-Math.PI/2); // shape y (north) -> -z ; depth -> up
    const mesh = new THREE.Mesh(geo, [roofMat, facadeVariants[idx % 3]]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    cityGroup.add(mesh);
  });
}).catch(e => console.warn('buildings', e));

/* ---------- ground: dark base + wet mirror streets + asphalt skin ---------- */
const base = new THREE.Mesh(new THREE.PlaneGeometry(900, 900),
  new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:1 }));
base.rotation.x = -Math.PI/2; base.position.y = -0.05; base.receiveShadow = true; scene.add(base);

const mirrorOpts = { clipBias:0.003, textureWidth: innerWidth < 800 ? 512 : 1024, textureHeight: innerWidth < 800 ? 512 : 1024, color: 0x4a5560 };
const mirYonge = new Reflector(new THREE.PlaneGeometry(26, 460), mirrorOpts);
mirYonge.rotation.x = -Math.PI/2; mirYonge.position.y = 0.02; scene.add(mirYonge);
const mirDundas = new Reflector(new THREE.PlaneGeometry(460, 26), mirrorOpts);
mirDundas.rotation.x = -Math.PI/2; mirDundas.position.y = 0.026; scene.add(mirDundas);

function asphaltTexture(northSouth){
  const [c, g] = cnv(512, 512); const rnd = Math.random;
  g.clearRect(0, 0, 512, 512);
  g.fillStyle = 'rgba(13,16,21,0.88)'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 5200; i++){ g.fillStyle = `rgba(${140+rnd()*60},${150+rnd()*60},${170+rnd()*60},${rnd()*0.05})`; g.fillRect(rnd()*512, rnd()*512, 1.6, 1.6); }
  for (let i = 0; i < 22; i++){ // worn patches: mirror shows through
    const x = rnd()*512, y = rnd()*512, r = 20 + rnd()*70;
    const gr = g.createRadialGradient(x, y, 2, x, y, r);
    gr.addColorStop(0, 'rgba(13,16,21,0.25)'); gr.addColorStop(1, 'rgba(13,16,21,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(255,205,64,0.5)'; // centre dashes
  for (let y = 8; y < 512; y += 64) g.fillRect(253, y, 6, 34);
  g.fillStyle = 'rgba(230,238,245,0.4)';
  g.fillRect(52, 0, 4, 512); g.fillRect(456, 0, 4, 512); // lane edges
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function asphaltSkin(w, l, repX, repY){
  const t = asphaltTexture(); t.repeat.set(repX, repY);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l),
    new THREE.MeshStandardMaterial({ map:t, transparent:true, roughness:.92, metalness:.05, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.receiveShadow = true; m.renderOrder = 2; return m;
}
const skinY = asphaltSkin(26, 460, 1, 18); skinY.position.y = 0.05; scene.add(skinY);
const skinD = asphaltSkin(460, 26, 18, 1); skinD.position.y = 0.055; scene.add(skinD);

/* crosswalks at the intersection */
(function crosswalks(){
  const [c, g] = cnv(256, 256); g.clearRect(0,0,256,256);
  g.fillStyle = 'rgba(235,242,248,0.5)';
  for (let i = 0; i < 6; i++) g.fillRect(14 + i*40, 10, 22, 236);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshStandardMaterial({ map:t, transparent:true, roughness:.9, depthWrite:false });
  [[0,-15.5,0],[0,15.5,0],[-15.5,0,Math.PI/2],[15.5,0,Math.PI/2]].forEach(([x,z,r]) => {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(24, 5.4), mat);
    p.rotation.x = -Math.PI/2; p.rotation.z = r; p.position.set(x, 0.06, z); p.renderOrder = 3; scene.add(p);
  });
})();

/* ---------- authored shopfronts: lit interiors at street level ---------- */
function shopBand(w, x, z, ry){
  const [c, g] = cnv(1024, 96);
  g.fillStyle = '#0d0f13'; g.fillRect(0, 0, 1024, 96);
  const tints = ['255,180,107', '191,227,255', '255,180,107', '255,61,240', '191,227,255'];
  for (let i = 0; i < 5; i++){
    const x0 = 18 + i * 200, w0 = 160;
    const gr = g.createLinearGradient(0, 8, 0, 88);
    gr.addColorStop(0, `rgba(${tints[i]},0.8)`); gr.addColorStop(1, `rgba(${tints[i]},0.28)`);
    g.fillStyle = gr; g.fillRect(x0, 10, w0, 78);
    g.fillStyle = 'rgba(5,8,12,0.55)';
    for (let k = 0; k < 4; k++) g.fillRect(x0 + 14 + k * 38, 52, 22, 36); // shelf silhouettes
    g.fillRect(x0 + w0/2 - 2, 10, 4, 78); // mullion
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3.6, 0.7),
    new THREE.MeshStandardMaterial({ map:t, emissiveMap:t, emissive:0xffffff, emissiveIntensity:0.5, roughness:.35, metalness:.15 }));
  m.position.set(x, 1.8, z); m.rotation.y = ry; scene.add(m);
}
shopBand(24, -8, -13.6, 0);            // north side, west of Yonge
shopBand(24, 14, -13.6, 0);            // north side, east of Yonge
shopBand(24, -4, 13.6, Math.PI);       // south side
shopBand(20, 13.6, -2, -Math.PI/2);    // east side
shopBand(20, -13.6, 5, Math.PI/2);     // west side

/* ---------- neon signs ---------- */
const glowTex = (() => { const [c, g] = cnv(128, 128);
  const gr = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,0.85)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c); })();

function sign(text, color, w, x, y, z, ry, vertical=false){
  const h = vertical ? w * text.length * 0.92 : w * 0.34;
  const [c, g] = cnv(vertical ? 128 : 512, vertical ? 512 : 128);
  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = color; g.lineWidth = 4; g.strokeRect(5, 5, c.width-10, c.height-10);
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 22;
  if (vertical){ g.font = '700 74px "Arial Narrow", Arial'; [...text].forEach((ch, i) => g.fillText(ch, 64, 52 + i * (456/Math.max(1, text.length-0.4)))); }
  else { g.font = '700 64px "Arial Narrow", Arial'; g.fillText(text, 256, 68); g.fillText(text, 256, 68); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map:t, transparent:true, side:THREE.DoubleSide }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:new THREE.Color(color), transparent:true, opacity:.26, blending:THREE.AdditiveBlending, depthWrite:false }));
  glow.scale.set(w * 1.9, h * 1.9, 1); glow.position.set(x, y, z); scene.add(glow);
  return m;
}
sign('EATON',    '#ff2d55', 11,   15.5, 8.5, -13.5, -Math.PI/2);       // NE tower face, looking west
sign('YONGE',    '#19d3ff', 3.2,  13.2, 9.5,  12.5,  Math.PI, true);   // vertical blade, SE
sign('DUNDAS SQ','#ff3df0', 10,  -14.0, 7.5, -12.0,  Math.PI/2);       // NW face
sign('RAMEN',    '#19d3ff', 2.6, -12.6, 6.5,  11.0,  0, true);         // SW vertical
sign('PHARMACY', '#ff4040', 7,   -14.5, 5.0,  14.5,  Math.PI/2);       // SW face
sign('CINEMA',   '#bcd8ff', 8,    16.0, 10.5, 16.0, -Math.PI/2);       // SE high

/* CN Tower — distant landmark, pink-lit, ignores fog */
(function cnTower(){
  const [c, g] = cnv(128, 512);
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#ff5d8a'); gr.addColorStop(0.55, '#c22a55'); gr.addColorStop(1, '#5e1030');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(56, 512); g.lineTo(63, 150); g.lineTo(52, 118); g.lineTo(76, 118); g.lineTo(65, 150); g.lineTo(72, 512); g.fill();
  g.fillStyle = '#ffd7e2'; g.fillRect(60, 96, 8, 26);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(90, 360),
    new THREE.MeshBasicMaterial({ map:t, transparent:true, fog:false, side:THREE.DoubleSide }));
  m.position.set(-330, 150, 560); m.rotation.y = Math.atan2(camera.position.x + 330, camera.position.z - 560);
  scene.add(m);
})();

/* ---------- dressing props (the hero set, lit this time) ---------- */
const loader = new GLTFLoader();
fetch('hero-tiles/dressing.json').then(r => r.json()).then(d => {
  const cache = {};
  d.placements.filter(p => p.src !== 'storefront').forEach(p => {
    const src = 'hero-tiles/dressing/' + p.src + (p.src.endsWith('.glb') ? '' : '.glb');
    if (!cache[src]) cache[src] = loader.loadAsync(src).catch(() => null);
    cache[src].then(gltf => { if (!gltf) return;
      const o = gltf.scene.clone(true);
      o.position.set(p.pos[0], 0, p.pos[1]); o.rotation.y = p.rotY;
      o.traverse(n => { if (n.isMesh){ n.castShadow = true; n.receiveShadow = true;
        if (n.material && n.material.color) n.material = n.material.clone(), n.material.color.multiplyScalar(0.72); } });
      scene.add(o);
    });
  });
}).catch(e => console.warn('dressing', e));

/* streetcar headlights */
[[8.6, 30.6], [8.6, 24.4]].forEach(([x, z]) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0xffca7a, transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false }));
  s.scale.set(3.2, 3.2, 1); s.position.set(x, 1.1, z); scene.add(s);
});

/* ---------- the survivor + two zombies in a neon pool ---------- */
const mixers = []; const drifters = [];
function actor(path, x, z, ry, clip, scaleTo = 1.8, drift = null){
  loader.loadAsync(path).then(gltf => {
    const root = gltf.scene;
    let geoH = 1; root.traverse(n => { if (n.isMesh && n.geometry){ n.geometry.computeBoundingBox(); const bb = n.geometry.boundingBox; geoH = Math.max(geoH, bb.max.y - bb.min.y); n.castShadow = true; n.frustumCulled = false; } });
    root.scale.setScalar(scaleTo / geoH);
    root.position.set(x, 0, z); root.rotation.y = ry;
    scene.add(root);
    const mx = new THREE.AnimationMixer(root);
    const act = THREE.AnimationClip.findByName(gltf.animations, clip);
    if (act) mx.clipAction(act).play();
    mixers.push(mx); root.userData.mx = mx;
    if (drift){ root.userData.drift = drift; drifters.push(root); }
    return root;
  }).catch(e => console.warn('actor', path, e));
}
actor('chars/survivor.glb', 4.2, 7.2, Math.PI, 'idle', 1.78);           // under the hero spot, back to camera
const z1 = actor('chars/zombie.glb', -12, -17, Math.PI/2, 'walk', 1.85, { from:-13, to:13, speed:0.7 }); // crossing the cyan pool on Yonge
const z2 = actor('chars/zombie.glb', 12, -44, -Math.PI/2, 'walk', 1.85, { from:13, to:-13, speed:-0.45 });

/* ---------- rain ---------- */
const RAIN = 1600, rainPos = new Float32Array(RAIN * 3);
for (let i = 0; i < RAIN; i++){ rainPos[i*3] = (Math.random()-0.5) * 130; rainPos[i*3+1] = Math.random() * 42; rainPos[i*3+2] = (Math.random()-0.5) * 130; }
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainTex = (() => { const [c, g] = cnv(16, 64); const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, 'rgba(170,210,255,0)'); gr.addColorStop(0.5, 'rgba(170,210,255,0.75)'); gr.addColorStop(1, 'rgba(170,210,255,0)');
  g.fillStyle = gr; g.fillRect(6, 0, 4, 64); return new THREE.CanvasTexture(c); })();
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ map:rainTex, size:1.5, transparent:true, opacity:.34, depthWrite:false, blending:THREE.AdditiveBlending, color:0x9fc4e8 }));
scene.add(rain);

/* ---------- post: bloom + grade ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.55, 0.65);
composer.addPass(bloom);
const GradePass = {
  uniforms: { tDiffuse:{ value:null }, time:{ value:0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec4 col = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5;
      col.rgb *= 1.0 - dot(d, d) * 0.55;                                   // vignette
      col.rgb += (hash(vUv * vec2(1920.0, 1080.0) + fract(time) * 7.0) - 0.5) * 0.028; // grain
      col.rgb = mix(col.rgb, col.rgb * vec3(0.96, 1.02, 1.1), 0.35);      // cold shadows
      gl_FragColor = col;
    }`
};
const grade = new ShaderPass(GradePass); composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- camera: street (OTS at the survivor) / eagle ---------- */
let view = 'street';
let yaw = 0.12, pitch = 0.06, dist = 6.4, dragging = false, px = 0, py = 0, idleT = 0;
const pivot = new THREE.Vector3(4.2, 1.55, 7.2);
let eagleT = 0;
const _camPos = new THREE.Vector3(), _look = new THREE.Vector3(), _eaglePos = new THREE.Vector3(), _origin = new THREE.Vector3(0, 0, 0);
function applyCam(t, dt){
  eagleT = THREE.MathUtils.clamp(eagleT + (view === 'eagle' ? dt / 1.6 : -dt / 1.2), 0, 1);
  const e = eagleT * eagleT * (3 - 2 * eagleT);
  const drift = idleT > 4 ? Math.sin(t * 0.11) * 0.05 : 0;
  const y = yaw + drift, p = pitch + Math.sin(t * 0.07) * 0.008;
  _camPos.set(
    pivot.x + Math.sin(y) * Math.cos(p) * dist,
    pivot.y + Math.sin(p) * dist + 0.25,
    pivot.z + Math.cos(y) * Math.cos(p) * dist);
  _look.set(pivot.x - Math.sin(y) * 8, pivot.y - 0.25, pivot.z - Math.cos(y) * 8);
  if (e > 0){
    _eaglePos.set(Math.sin(t * 0.02) * 55, 125, 125);
    _camPos.lerp(_eaglePos, e); _look.lerp(_origin, e);
    scene.fog.density = THREE.MathUtils.lerp(FOG_STREET, FOG_EAGLE, e);
    hemi.intensity = THREE.MathUtils.lerp(0.45, 0.8, e);
  }
  camera.position.copy(_camPos);
  camera.lookAt(_look);
}
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; idleT = 0; });
addEventListener('pointermove', e => { if (!dragging) return;
  yaw -= (e.clientX - px) * 0.0042; pitch = THREE.MathUtils.clamp(pitch + (e.clientY - py) * 0.003, -0.12, 0.5);
  px = e.clientX; py = e.clientY; idleT = 0; });
addEventListener('pointerup', () => dragging = false);
addEventListener('wheel', e => { dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.01, 3.4, 15); }, { passive:true });

const btnS = document.getElementById('btnStreet'), btnE = document.getElementById('btnEagle');
function setView(v){ view = v;
  btnS.classList.toggle('on', v === 'street'); btnE.classList.toggle('on', v === 'eagle');
  if (v === 'eagle') scene.fog.color.set(0x0d1830); else { scene.fog.color.set(0x0a1424); scene.fog.density = FOG_STREET; }
}
btnS.onclick = () => setView('street'); btnE.onclick = () => setView('eagle');

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let firstFrames = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  idleT += dt;
  mixers.forEach(m => m.update(dt));
  drifters.forEach(r => { const d = r.userData.drift; r.position.x += d.speed * dt;
    if (d.speed > 0 && r.position.x > d.to) r.position.x = d.from;
    if (d.speed < 0 && r.position.x < d.to) r.position.x = d.from; });
  const pa = rain.geometry.attributes.position;
  for (let i = 0; i < RAIN; i++){ let y = pa.getY(i) - dt * 26; if (y < 0) y = 42; pa.setY(i, y); }
  pa.needsUpdate = true;
  rain.position.x = camera.position.x * 0.6; rain.position.z = camera.position.z * 0.6;
  grade.uniforms.time.value = t;
  applyCam(t, dt);
  composer.render();
  if (++firstFrames === 12) document.getElementById('load').classList.add('off');
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* QA hooks */
window.__noir = {
  setView,
  snap(){ eagleT = view === 'eagle' ? 1 : 0; },
  eagleT(){ return eagleT; },
  shot(){ composer.render(); return renderer.domElement.toDataURL('image/png'); },
  state(){ return { view, camPos: camera.position.toArray().map(v=>+v.toFixed(1)), children: scene.children.length, drifters: drifters.map(r => [+(r.position.x.toFixed(1)), +(r.position.z.toFixed(1))]), mixers: mixers.length }; }
};
</script>
